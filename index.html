<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Galería de Animaciones — Métodos Matemáticos</title>
  <style>
    /* 👇 Fondo con imagen */
    html {
      background: url('/proyecto/img/fondo.png') no-repeat center center fixed;
      background-size: cover;
    }

    /* 👇 Capa oscura para mejorar contraste */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      z-index: 0;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      color: #f0f0f0;
      position: relative;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      padding: 20px 12px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 1;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .item {
      background: rgba(28, 28, 28, 0.8);
      border-radius: 12px;
      padding: 12px;
      max-width: 420px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.08);
    }

    .item img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .item img:hover {
      transform: scale(1.05);
    }

    .caption {
      margin-top: 8px;
      font-weight: 600;
      text-align: center;
    }

    footer {
      text-align: center;
      margin: 24px 0;
      color: #ccc;
      font-size: 0.9em;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
    }

    /* Fullscreen GIF */
    .fullscreen-img {
      object-fit: contain;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>📽️ Galería de Animaciones — Métodos Matemáticos</h1>

  <div class="gallery">
    <div class="item">
      <img src="gifs/regresion_diodo_ajuste%20(1).gif" alt="Regresión — Ajuste de Shockley" onclick="openFullscreen(this)">
      <div class="caption">🔄 Regresión — Ajuste de Shockley</div>
    </div>

    <div class="item">
      <img src="gifs/interpolacion_ventana%20(1).gif" alt="Interpolación — Ventana deslizante" onclick="openFullscreen(this)">
      <div class="caption">🎚️ Interpolación — Ventana deslizante</div>
    </div>

    <div class="item">
      <img src="gifs/fdtd_propagacion%20(1).gif" alt="FDTD — Propagación 1D" onclick="openFullscreen(this)">
      <div class="caption">🌊 FDTD — Propagación 1D</div>
    </div>
  </div>

  <footer>© 2025 - Proyecto de Métodos Matemáticos</footer>

  <script>
    let fullscreenWrapper = null;

    function openFullscreen(img) {
      fullscreenWrapper = document.createElement("div");
      fullscreenWrapper.classList.add("fullscreen-img");

      const clone = img.cloneNode();
      fullscreenWrapper.appendChild(clone);
      fullscreenWrapper.onclick = closeFullscreen;

      document.body.appendChild(fullscreenWrapper);

      if (fullscreenWrapper.requestFullscreen) {
        fullscreenWrapper.requestFullscreen();
      } else if (fullscreenWrapper.webkitRequestFullscreen) {
        fullscreenWrapper.webkitRequestFullscreen();
      } else if (fullscreenWrapper.msRequestFullscreen) {
        fullscreenWrapper.msRequestFullscreen();
      }
    }

    function closeFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
      fullscreenWrapper.remove();
    }

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && fullscreenWrapper) {
        fullscreenWrapper.remove();
      }
    });
  </script>
</body>
</html>
